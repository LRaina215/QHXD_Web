logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512

authMethod: http
authHTTPAddress: http://127.0.0.1:9000/internal/media-auth
authHTTPExclude:
  - action: read
  - action: playback
  - action: api
  - action: metrics
  - action: pprof

api: true
apiAddress: 127.0.0.1:9997
metrics: true
metricsAddress: 127.0.0.1:9998
pprof: false
playback: false
moq: false

rtsp: false
srt: false
rtmp: true
rtmpEncryption: "no"
rtmpAddress: :1935

hls: true
hlsAddress: 127.0.0.1:8888
hlsEncryption: false
hlsAllowOrigins:
  - https://lingxunrobot.cn
  - https://www.lingxunrobot.cn
hlsTrustedProxies: [127.0.0.1, "::1"]
hlsAlwaysRemux: false
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 10M
hlsMuxerCloseAfter: 30s

webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: false
webrtcAllowOrigins:
  - https://lingxunrobot.cn
  - https://www.lingxunrobot.cn
webrtcTrustedProxies: [127.0.0.1, "::1"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [106.53.169.127]

pathDefaults:
  source: publisher
  overridePublisher: false
  record: false

paths:
  robot/front: {}
