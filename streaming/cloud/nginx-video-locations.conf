# Include these locations inside the lingxunrobot.cn HTTPS server block.
location = /_video_auth {
    internal;
    proxy_pass http://127.0.0.1:9000/internal/video-session-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
}

location /video/webrtc/ {
    auth_request /_video_auth;
    proxy_pass http://127.0.0.1:8889/;
    proxy_redirect / /video/webrtc/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_read_timeout 30s;
}

location /video/hls/ {
    auth_request /_video_auth;
    proxy_pass http://127.0.0.1:8888/;
    proxy_redirect / /video/hls/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_read_timeout 30s;
}
